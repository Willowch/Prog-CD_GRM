dataset: all_beauty                 # Dataset name used by RecBole.
data_path: CD_GRM/data/             # Dataset root; resolved to CD_GRM/data/All_Beauty at runtime.
device: cuda                        # Prefer GPU training/evaluation when CUDA is available.
seed: 42                            # Global random seed for reproducibility.

USER_ID_FIELD: user_id              # User id column in the .inter file.
ITEM_ID_FIELD: item_id              # Item id column in the .inter file.
TIME_FIELD: timestamp               # Timestamp column used for sequence ordering.

load_col:
  inter: [user_id, item_id, timestamp]   # Only load the columns needed for sequential recommendation.
filter_inter_by_user_or_item: true       # Filter users/items by interaction count.
user_inter_num_interval: "[1,inf)"       # Keep users with at least 1 interaction.
item_inter_num_interval: "[1,inf)"       # Keep items with at least 1 interaction.
ITEM_LIST_LENGTH_FIELD: item_length      # RecBole-generated history length field.
LIST_SUFFIX: _list                       # RecBole-generated history suffix.
MAX_ITEM_LIST_LENGTH: 50                 # Truncate history to the most recent 50 items.
train_neg_sample_args: null              # Full-sort training without explicit negative sampling.

eval_args:
  split:
    LS: valid_and_test                   # Leave-one-out style split for valid/test.
  order: TO                              # Construct sequences in time order.
  mode: full                             # Evaluate against the full candidate set.

model_config:
  embed_dim: 128                         # Shared embedding dimension.
  m_layers: 2                            # Number of residual quantization layers.
  codebook_size: 32                      # Codebook size per quantization layer.
  diffusion_steps: 20                    # Denoising steps.
  transformer_layers: 2                  # Denoising transformer depth.
  nhead: 4                               # Multi-head attention heads.
  use_seq_graph_fusion: true             # Enable the sequence + graph fusion ranker.
  ranker_layers: 2                       # Sequence ranker transformer depth.
  ranker_dropout: 0.2                    # Sequence ranker dropout.
  tau: 0.057317870293182936              # InfoNCE temperature from the current strong trial.
  max_degree: 7                          # Max temporal graph neighbors per item.
  dead_code_warmup_steps: 20             # Warmup before dead-code checking.
  dead_code_patience: 20                 # Patience for low-usage code detection.
  dead_code_min_usage_ratio: 0.10        # Minimum code usage ratio.
  item_loss_weight: 2.0                  # Strength of the direct next-item ranker loss.
  hybrid_semantic_weight: 0.0            # Keep semantic-score blending off; current validation shows pure item ranking is steadier.
  stage2_aux_loss_weight: 1.0            # Weight for CE / CL / commitment auxiliary losses in stage2.
  finetune_item_embedding_stage2: true   # Continue tuning shared item embeddings in stage2.
  item_embedding_stage2_lr_scale: 0.75   # Stage2 LR scale for item embeddings.
  graph_window_size: 6                   # Verified broader temporal co-occurrence window for the current single-checkpoint best path.
  graph_context_decay: 0.56              # Verified target-aware graph-prior decay for the strongest single checkpoint under the current architecture.
  graph_prior_weight: 2.50               # Verified target-aware graph-prior strength for the current best single-checkpoint operating point.
  use_target_aware_graph_prior: true     # Reweight graph neighbors with the current target query instead of using a purely static position prior.
  graph_prior_sim_scale: 2.0             # Similarity scale for the target-aware graph-prior attention.
  graph_prior_recency_strength: 2.25     # Strength of the recency log-bias inside the target-aware graph-prior attention.
  graph_prior_second_hop_weight: 0.12    # Light two-hop diffusion weight; verified to improve both valid and test on the strongest checkpoint.
  history_repeat_prior_weight: 0.06      # Verified light history-repeat prior; helps preserve repeat-consumption signal without overpowering transition modeling.
  last_item_prior_weight: 0.08           # Verified small shortcut for the most recent item; improves valid while keeping test stable on the strongest checkpoint.
  commitment_cost: 0.25                  # Quantization commitment loss weight.
  decay: 0.8                             # EMA decay for the quantizer.
  eps: 1.0e-5                            # Numerical stability epsilon.
  restart_thres: 1.0                     # Dead-code restart threshold.
  dropout: 0.2                           # Denoising transformer dropout.

train_batch_size: 128                    # Training batch size.
eval_batch_size: 64                      # Validation / test batch size.
learning_rate: 0.0006150745904964907     # Current strong learning rate.
weight_decay: 0.0009340308327072935      # Current strong weight decay.
epochs: 50                               # Total stage2 epochs.
topk: [5, 10, 20]                        # Evaluation cutoffs.

stage1_epochs: 10                        # Current strong stage1 epochs.
freeze_rqvae_stage2: true                # Freeze the quantizer in stage2.
auto_select_best_trial: true             # Strict single-checkpoint mode: automatically pick the best compatible trial on the current validation setting.
