# =========================
# SASRec on All_Beauty
# =========================

dataset: all_beauty
seed: 42
device: cuda:0
reproducibility: true
show_progress: true

# -------------------------------------------------
# 数据字段
# 这里默认你的 .inter 里字段名就是 user_id / item_id / timestamp
# 如果你实际 header 不一样，就把下面三个字段名改成你的真实字段名
# -------------------------------------------------
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp

load_col:
  inter: [user_id, item_id, timestamp]

# 序列长度
MAX_ITEM_LIST_LENGTH: 50

# -------------------------------------------------
# 评测设置
# 尽量与论文主实验保持一致
# full 排序评测更标准
# -------------------------------------------------
eval_args:
  group_by: user
  order: TO
  split: {'LS': 'valid_and_test'}
  mode: full

metrics: [Recall, NDCG]
topk: [5, 10, 20]
valid_metric: NDCG@10

# 训练过程
epochs: 100
eval_step: 1
stopping_step: 10

# batch
train_batch_size: 256
eval_batch_size: 256

# optimizer
learning_rate: 0.001
weight_decay: 0.0

# -------------------------------------------------
# SASRec 起始配置
# 说明：
# - RecBole 文档默认更保守：64/256/2/2/dropout=0.5
# - 这里给你的是更适合作为论文 baseline 起点的一套：
#   128/512/2/4/dropout=0.2
# - 这样既不离谱，也更接近你当前 CD-GRM 的规模
# -------------------------------------------------
hidden_size: 128
inner_size: 512
n_layers: 2
n_heads: 4
hidden_dropout_prob: 0.2
attn_dropout_prob: 0.2
hidden_act: gelu
layer_norm_eps: 1.0e-12
initializer_range: 0.02
loss_type: CE